version: "3.8"

services:
  app:
    build: .
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
      - pip_volume:/cache
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    ports:
      - 5432:5432
    volumes:
      - 3mtt_postgres_datai:/var/lib/postgresql/data
    env_file:
      - .env
  #
  # pgadmin:
  #   image: dpage/pgadmin4
  #   ports:
  #     - 5050:80
  #   env_file:
  #     - .env
  #   depends_on:
  #     - db

  redis:
    image: redis:7
    ports:
      - 6379:6379
volumes:
  pip_volume:
  3mtt_postgres_datai:
