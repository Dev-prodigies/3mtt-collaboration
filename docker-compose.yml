version: "3.8"

services:
  app:
    build: .
    volumes:
      - ./backend:/app
      - pip_volume:/cache
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - db

  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pip_volume:
  postgres_data:
